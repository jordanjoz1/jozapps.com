name: Fetch and Publish Currency Rates

on:
  schedule:
    # Runs at 00:00 and 12:00 UTC every day
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  update-rates:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push to gh-pages

    steps:
      - name: Create output directory
        run: mkdir -p public/v1

      - name: Fetch Fixer.io Rates
        run: |
          curl -s "http://data.fixer.io/api/latest?access_key=${{ secrets.FIXER_API_KEY }}" -o public/v1/latest

      - name: Verify JSON is valid
        run: |
          if ! jq -e . public/v1/latest > /dev/null; then
            echo "Invalid JSON received from Fixer.io"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: true
